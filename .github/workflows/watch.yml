name: job-watch

on:
  schedule:
    # UTC 기준. 한국시간 08:30 / 18:30 (KST = UTC+9)
    - cron: "30 23 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # state/seen.json, docs/index.html 커밋용
  pages: write
  id-token: write

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 공고 수집 및 알림
        env:
          ALIO_SERVICE_KEY: ${{ secrets.ALIO_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py run

      - name: 상태 및 보드 커밋
        run: |
          git config user.name  "job-watch"
          git config user.email "actions@github.com"
          git add state/seen.json docs/index.html
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 공고 갱신 $(date -u +%Y-%m-%d)"
            # 원격이 앞서 있으면 최신을 받아 그 위에 다시 얹는다
            git pull --rebase --autostash origin main || true
            git push || echo "push 실패 — 다음 실행에서 재시도"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: watch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
