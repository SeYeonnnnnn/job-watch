# ============================================================
# 채용 공고 감시 설정
# 이 파일만 고치면 감시 대상과 필터가 바뀝니다. 코드는 건드릴 필요 없음.
# ============================================================

# ------------------------------------------------------------
# 1) 직무 키워드 — 3단 티어
#    core   : 희망 직무의 핵심. 하나만 걸려도 최우선 알림
#    related: 인접 직무. 기관 화이트리스트와 겹칠 때만 의미 있음
#    signal : 신입/공채 신호. 점수 가산용 (단독으로는 매칭 안 됨)
#    exclude: 확실한 노이즈만. 애매하면 넣지 말 것 (미탐이 오탐보다 치명적)
# ------------------------------------------------------------
keywords:
  core:
    - 데이터
    - 빅데이터
    - 데이터분석
    - 머신러닝
    - 인공지능
    - AI
    - 통계
    - 리스크
    - 신용평가
    - 신용리스크
    - 모형
    - 계량
    - 금융공학
    - 애널리스트
    - Analyst
    - 기술평가
    - 심사
    - CSS
    - 신용평가모델
    - 모델 개발
    - 분석모델
    - FDS
    - 이상거래
    - 이상탐지
    - 사기탐지
    - 채권관리
    - 부도
    - Credit
    - Scoring
    - Modeler
    - Underwriting
    - 여신
    - 평가모형
    - 스코어링
    - 계량분석
    - 리스크관리

  # 채용연계형 인턴십은 학부생이 직무를 지정해 들어갈 수 있는 거의 유일한 통로다.
  # exclude 의 '체험형/청년인턴' 과 혼동하지 말 것.

  related:
    - 디지털
    - ICT
    - IT
    - 이공계
    - 전산
    - 금융일반
    - 상경
    - 투자평가
    - 기업금융

  # 공채 신호 — 감시 대상 기업/기관의 공고라면 직무 키워드가 없어도 통과시킨다.
  # (은행 공채는 "UB 부문"처럼 직무명이 사내 용어라 키워드가 안 걸린다)
  open_recruitment:
    - 공채
    - 공개채용
    - 신입행원
    - 신입직원
    - 신입사원
    - 대졸신입
    - 신입 채용
    - 신입직
    - 채용연계형
    - 인턴십
    - 신입
    - 대졸
    - 정기채용
    - 통합모집
    - 인재 모집
    - 인재모집

  signal:
    - 정규직
    - 5급
    - 수시채용
    - 상시채용

  exclude:
    - 체험형
    - 청년인턴
    - 고졸
    - 특성화고
    - 단기노무
    - 무기계약
    - 청소
    - 시설관리

# ------------------------------------------------------------
# 2) 기관 화이트리스트
#    잡알리오에서 이 기관 공고는 직무 키워드와 무관하게 전부 수집.
#    부문 구조가 해마다 바뀌므로 직무 필터를 먼저 걸면 놓칩니다.
# ------------------------------------------------------------
watchlist_institutions:
  - 신용보증기금
  - 기술보증기금
  - 한국산업은행
  - 중소기업은행
  - 한국주택금융공사
  - 예금보험공사
  - 한국자산관리공사
  - 서민금융진흥원
  - 신용회복위원회

# ------------------------------------------------------------
# 3) 공공 오픈API
#    개인도 신청 가능한 정식 채널만 쓴다.
#    ※ endpoint / field_map 은 활용신청 후 Swagger 문서로 확인해 채울 것.
#      `python watch.py probe-api alio` 로 원문 응답을 덤프할 수 있다.
# ------------------------------------------------------------
apis:
  # 공공기관 채용 (기획재정부 잡알리오) — 신보·기보·산은·기은 커버
  - id: alio
    enabled: false
    group: 공공기관
    format: json
    endpoint: "https://apis.data.go.kr/1051000/recruitment/list"
    service_key_env: ALIO_SERVICE_KEY
    page_param: pageNo
    rows_param: numOfRows
    rows_per_page: 100
    max_pages: 10
    static_params:
      resultType: json
    result_path: ["result"]
    field_map:
      org: instNm
      title: recrutPbancTtl
      url: srcUrl
      posted: pbancBgngYmd
      deadline: pbancEndYmd
      employment_type: hireTypeNmLst
      category: ncsCdNmLst

  # 워크넷 (고용노동부) — 민간기업 공고까지 포함. XML 응답.
  #   잡코리아·사람인을 크롤링하는 대신 쓰는 합법적 대체재.
  #   키워드로 걸러 오므로 static_params 의 keyword 를 조정해 쓸 것.
  - id: worknet
    enabled: false
    group: 민간
    format: xml
    endpoint: "https://openapi.work.go.kr/opi/opi/opia/wantedApi.do"
    service_key_env: WORKNET_API_KEY
    auth_param: authKey
    page_param: startPage
    rows_param: display
    rows_per_page: 100
    max_pages: 5
    static_params:
      callTp: L
      returnType: XML
      keyword: 신용평가
    result_path: ["wantedRoot", "wanted"]
    field_map:
      org: company
      title: title
      url: wantedInfoUrl
      posted: regDt
      deadline: closeDt
      employment_type: empTpNm
      category: jobsCd

# ------------------------------------------------------------
# 4) 민간 채용 사이트
#    mode: links    → 링크 텍스트를 뽑아 공고 목록으로 취급 (정적 HTML)
#          snapshot → 페이지 본문 해시만 비교, 변경 시 "확인 필요" 알림
#    ※ SPA(자바스크립트 렌더링) 사이트는 links 모드가 빈 결과를 냅니다.
#      `python watch.py probe-site <id>` 로 판별한 뒤 snapshot 으로 바꾸세요.
#    ※ 공식 채용 페이지만 대상으로 합니다. 상용 채용 플랫폼 크롤링은 약관 위반 소지.
# ------------------------------------------------------------
sites:
  # --- 신용평가사 ---
  # NICE그룹 통합 채용 페이지 — 신용평가·평가정보·디앤비·피앤아이 등 계열사 공고가 함께 뜬다.
  # 계열사는 걸러내지 않고, 직무 키워드로만 선별한다.
  - id: nice_group
    name: NICE그룹
    group: 신용평가사
    url: https://nice.career.greetinghr.com/ko/intro
    mode: links
    # greetinghr 공고 주소는 /ko/o/<번호> 형태
    detail_url: https://nice.career.greetinghr.com/ko/o/{id}

  - id: korea_ratings
    name: 한국기업평가
    group: 신용평가사
    url: https://www.korearatings.com/cms/frCmnCon/index.do?MENU_ID=1270
    mode: links

  - id: kis_rating
    name: 한국신용평가
    group: 신용평가사
    url: https://kisrating.career.co.kr/
    mode: links
    detail_url: https://kisrating.career.co.kr/jobs/jobs_view.asp?ID={id}

  - id: kofia_board
    name: 금융투자협회 회원사 채용안내
    group: 신용평가사
    url: https://www.kofia.or.kr/brd/m_96/list.do
    mode: links

  # --- 시중은행 ---
  - id: kb_bank
    name: KB국민은행
    group: 시중은행
    url: https://kbstar.incruit.com/hire/hirelist.asp
    mode: links

  - id: shinhan_digital
    name: 신한은행 디지털/ICT
    group: 시중은행
    url: https://shinhandigital.recruiter.co.kr/career/home
    mode: manual
    note: recruiter.co.kr 계열 — robots 확인 필요, 직접 확인 권장

  - id: hana_bank
    name: 하나은행
    group: 시중은행
    url: https://hanabank.incruit.com/
    mode: snapshot

  # 우리은행은 채널이 둘로 나뉜다.
  #   공채(신입행원) → 잡코리아 호스팅 채용홈
  #   전문직·수시    → 인크루트 호스팅 채용홈 (공고 목록이 텍스트로 노출됨)
  - id: woori_gongchae
    name: 우리은행 공채
    group: 시중은행
    url: https://jrs.jobkorea.co.kr/wooribank
    mode: snapshot

  - id: woori_susi
    name: 우리은행 수시·전문직
    group: 시중은행
    url: https://recruit.incruit.com/wooribank/job/
    mode: links

  - id: woorifg
    name: 우리금융그룹
    group: 시중은행
    url: https://www.woorifg.com/kor/recruit/recruit-announcement/list.do
    mode: links
    legacy_ssl: true      # UNSAFE_LEGACY_RENEGOTIATION 요구 서버

  # --- 인터넷전문은행 (직무명이 붙은 신입 채용이 실제로 열리는 곳) ---
  # recruiter.co.kr 은 robots.txt 로 자동 접근을 금지하고 있어 수집하지 않는다.
  - id: kbank
    name: 케이뱅크
    group: 인터넷은행
    url: https://kbank.recruiter.co.kr/app/jobnotice/list
    mode: manual
    note: robots.txt 로 크롤링 금지 — 직접 확인 또는 자소설닷컴 알림 사용

  - id: kakaobank
    name: 카카오뱅크
    group: 인터넷은행
    url: https://recruit.kakaobank.com/jobs
    mode: snapshot

  - id: toss
    name: 토스(비바리퍼블리카)
    group: 인터넷은행
    url: https://toss.im/career
    mode: snapshot

  # --- 카드사 (CSS·신용평가모델 조직이 은행보다 큼) ---
  - id: kbcard
    name: KB국민카드
    group: 카드사
    url: https://kbcard.incruit.com/
    mode: snapshot

  - id: shcard
    name: 신한카드
    group: 카드사
    url: https://shcard.incruit.com/hire/hirelist.asp
    mode: links

  - id: hyundaicard
    name: 현대카드·현대커머셜
    group: 카드사
    url: https://careerhyundai.recruiter.co.kr/career/home
    mode: manual
    note: recruiter.co.kr 계열 — robots 확인 필요, 직접 확인 권장

  # 삼성 계열사 채용은 삼성커리어스에서 통합 공고로 뜬다.
  # 봇 접근을 차단해(500 응답) 자동 수집 불가 → manual
  - id: samsung_careers
    name: 삼성커리어스(삼성카드 포함)
    group: 카드사
    url: https://www.samsungcareers.com/hr/
    mode: manual
    note: 봇 차단 — 계열사 필터에서 삼성카드 확인

  # 공고 목록이 자바스크립트로만 그려져 정적 수집이 무의미 → manual
  - id: wooricard
    name: 우리카드
    group: 카드사
    url: https://pc.wooricard.com/dcpc/yh1/cid/cid06/empanc/H1CID202S00.do
    mode: manual
    note: 공고 목록이 JS 렌더 — 페이지에서 직접 확인

  - id: lotte_group
    name: 롯데그룹(롯데카드 포함)
    group: 카드사
    url: https://recruit.lotte.co.kr/
    mode: snapshot

  # --- 회계법인 (회계 경험 + 통계가 동시에 쓰이는 유일한 컨설팅 영역) ---
  - id: samil_pwc
    name: 삼일PwC
    group: 회계법인
    url: https://www.pwc.com/kr/ko/career/graduate-opportunities.html
    mode: manual
    note: 봇 차단(403) — 정기채용 일정은 직접 확인

  # --- 국책은행·보증기관 (잡알리오 보완용 직접 감시) ---
  - id: ibk_bank
    name: IBK기업은행
    group: 국책은행
    url: https://ibk.incruit.com/hire/hirelist.asp
    mode: links

  - id: kdb_bank
    name: KDB산업은행
    group: 국책은행
    url: https://kdb.incruit.com/hire/hirelist.asp
    mode: links

  - id: kodit
    name: 신용보증기금
    group: 보증기관
    url: https://www.kodit.or.kr/kodit/na/ntt/selectNttList.do?mi=2518&bbsId=407
    mode: links
    # detail_url: 게시판이 javascript:fn_view('12345') 같은 링크를 쓸 때,
    #   {id} 자리에 그 번호를 넣어 상세 주소를 조립한다.
    #   실제 주소는 브라우저에서 공고 하나를 열어 주소창을 복사해 확인할 것.
    #   `python watch.py probe-links kodit` 으로 원본 링크도 볼 수 있다.
    detail_url: https://www.kodit.or.kr/kodit/na/ntt/selectNttInfo.do?mi=2518&bbsId=407&nttSn={id}

  - id: kibo
    name: 기술보증기금
    group: 보증기관
    url: https://kibo.incruit.com/
    mode: snapshot

# ------------------------------------------------------------
# 5) 알림
# ------------------------------------------------------------
notify:
  telegram:
    enabled: true
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  # 텔레그램이 꺼져 있거나 실패하면 콘솔에만 출력됩니다.
  min_tier_to_notify: 2   # 3=최우선, 2=관심, 1=참고

# ------------------------------------------------------------
# 6) 링크 필터 (mode: links 전용)
#    게시판 페이지에는 메뉴·푸터 링크가 수십 개씩 섞여 있다.
#    링크 텍스트에 아래 단어 중 하나라도 있어야 공고로 인정한다.
#    놓치는 게 생기면 단어를 추가하면 된다.
# ------------------------------------------------------------
link_filter:
  must_contain_any:
    - 채용
    - 모집
    - 공고
    - 공채
    - 전형
    - 신입
    - 경력
    - 인턴
    - 선발
    - 초빙
    - recruit
    - hiring
  min_length: 8        # 이보다 짧은 링크 텍스트는 버림

  # 제목에 '채용'이 들어가지만 공고가 아닌 안내 링크들
  exclude_any:
    - 채용 중인 공고 확인
    - 채용중인 공고 확인
    - HIRING PROCESS
    - 채용 프로세스
    - 채용절차
    - 채용 절차
    - 채용안내
    - 채용 안내
    - 인재상
    - 채용문의
    - 채용 문의
    - 지원방법
    - 자주 묻는

# ------------------------------------------------------------
# 7) 수집 예절
# ------------------------------------------------------------
fetch:
  timeout: 20
  delay_seconds: 2          # 사이트 간 간격
  user_agent: "job-watch/1.0 (personal job alert; contact: your-email@example.com)"
